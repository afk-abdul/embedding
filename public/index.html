<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Stamper</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 1.5rem 1rem;
  }
  h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.04em; color: #fff; margin-bottom: 0.25rem; }
  .sub { font-size: 0.8rem; color: #666; margin-bottom: 1.5rem; }

  #drop-zone {
    border: 1.5px dashed #333;
    border-radius: 12px;
    padding: 2.5rem 1rem;
    text-align: center;
    cursor: pointer;
    background: #181818;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 1.25rem;
  }
  #drop-zone:hover, #drop-zone.drag { border-color: #555; background: #1f1f1f; }
  #drop-zone svg { margin-bottom: 0.75rem; }
  #drop-zone p { font-size: 0.95rem; color: #aaa; }
  #drop-zone span { font-size: 0.78rem; color: #555; }

  .section {
    background: #181818;
    border: 0.5px solid #282828;
    border-radius: 10px;
    padding: 0.85rem 1rem;
    margin-bottom: 1.25rem;
  }
  .section-title {
    font-size: 0.7rem;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title span {
    background: #222;
    color: #666;
    font-size: 0.6rem;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.04em;
  }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .field-grid .full { grid-column: span 2; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 0.68rem;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .field input {
    background: #111;
    border: 0.5px solid #2a2a2a;
    border-radius: 6px;
    color: #ddd;
    font-size: 0.82rem;
    padding: 0.45rem 0.6rem;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
    font-family: monospace;
  }
  .field input:focus { border-color: #555; }
  .field input.from-exif { border-color: #2a3d2a; color: #7ec87e; }
  .field input.fallback { border-color: #3d3020; color: #b8a06a; }

  .legend {
    display: flex;
    gap: 12px;
    margin-top: 0.6rem;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.68rem;
    color: #555;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.exif { background: #4a8a4a; }
  .dot.fallback { background: #7a5a2a; }

  .opts { display: flex; gap: 12px; flex-wrap: wrap; }
  .opts label { font-size: 0.82rem; color: #aaa; display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .opts input[type=radio] { accent-color: #888; }

  .preview-wrap {
    background: #111;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 180px;
  }
  #preview-canvas { max-width: 100%; display: block; }

  #download-btn {
    width: 100%;
    padding: 0.8rem;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    background: #fff;
    color: #111;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #download-btn:hover { background: #ddd; }
  #panel { display: none; }
</style>
</head>
<body>

<h1>📷 Photo Stamper</h1>
<p class="sub">Embeds GPS, elevation, date & time from EXIF metadata</p>

<div id="drop-zone" onclick="document.getElementById('file-input').click()">
  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
    <circle cx="12" cy="13" r="4"/>
  </svg>
  <p>Tap to pick a photo</p>
  <span>JPEG · HEIC · PNG</span>
</div>
<input type="file" id="file-input" accept="image/*" style="display:none">

<div id="panel">

  <!-- Editable metrics -->
  <div class="section">
    <div class="section-title">
      Stamp fields — edit if needed
      <span>tap any field to override</span>
    </div>
    <div class="field-grid">
      <div class="field">
        <label>Latitude</label>
        <input type="text" id="f-lat" placeholder="34.112833">
      </div>
      <div class="field">
        <label>Longitude</label>
        <input type="text" id="f-lon" placeholder="72.515528">
      </div>
      <div class="field">
        <label>Elevation</label>
        <input type="text" id="f-ele" placeholder="331.56±77.27 m">
      </div>
      <div class="field">
        <label>Accuracy</label>
        <input type="text" id="f-acc" placeholder="14.66 m">
      </div>
      <div class="field full">
        <label>Time</label>
        <input type="text" id="f-dt" placeholder="05-24-2026 17:40:30">
      </div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="dot exif"></div> Read from EXIF</div>
      <div class="legend-item"><div class="dot fallback"></div> Default fallback</div>
    </div>
  </div>

  <!-- Position & size -->
  <div class="section">
    <div class="section-title">Position</div>
    <div class="opts" style="margin-bottom: 0.75rem;">
      <label><input type="radio" name="corner" value="bl" checked> Bottom left</label>
      <label><input type="radio" name="corner" value="br"> Bottom right</label>
      <label><input type="radio" name="corner" value="tl"> Top left</label>
      <label><input type="radio" name="corner" value="tr"> Top right</label>
    </div>
    <div class="section-title" style="margin-top: 0.5rem;">Font size</div>
    <div class="opts">
      <label><input type="radio" name="fsize" value="small"> Small</label>
      <label><input type="radio" name="fsize" value="medium" checked> Medium</label>
      <label><input type="radio" name="fsize" value="large"> Large</label>
    </div>
  </div>

  <div class="preview-wrap">
    <canvas id="preview-canvas"></canvas>
  </div>

  <button id="download-btn">⬇ Download Stamped Photo</button>
</div>

<script>
// Default fallback values from reference image
function getNowStamp() {
  const n = new Date();
  const mm = String(n.getMonth()+1).padStart(2,'0');
  const dd = String(n.getDate()).padStart(2,'0');
  const yyyy = n.getFullYear();
  const hh = String(n.getHours()).padStart(2,'0');
  const min = String(n.getMinutes()).padStart(2,'0');
  const ss = String(n.getSeconds()).padStart(2,'0');
  return `${mm}-${dd}-${yyyy} ${hh}:${min}:${ss}`;
}
const DEFAULTS = {
  lat: '34.112833',
  lon: '72.515528',
  ele: '331.56±77.27 m',
  acc: '14.66 m',
  dt: getNowStamp()
};

let imgDataURL = null;

function dms(arr, ref) {
  if (!arr || arr.length < 3) return null;
  let d = arr[0] + arr[1]/60 + arr[2]/3600;
  if (ref === 'S' || ref === 'W') d = -d;
  return d;
}

function parseDate(str) {
  if (!str) return null;
  const [datePart, timePart] = str.split(' ');
  if (!datePart) return null;
  const [y, m, d] = datePart.split(':');
  return `${m}-${d}-${y} ${timePart || ''}`.trim();
}

function setField(id, value, fromExif) {
  const el = document.getElementById(id);
  el.value = value;
  el.classList.remove('from-exif', 'fallback');
  el.classList.add(fromExif ? 'from-exif' : 'fallback');
}

function redraw() {
  if (!imgDataURL) return;
  const canvas = document.getElementById('preview-canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);

    const corner = document.querySelector('input[name="corner"]:checked').value;
    const fsizeKey = document.querySelector('input[name="fsize"]:checked').value;

    const lat = document.getElementById('f-lat').value.trim();
    const lon = document.getElementById('f-lon').value.trim();
    const ele = document.getElementById('f-ele').value.trim();
    const acc = document.getElementById('f-acc').value.trim();
    const dt  = document.getElementById('f-dt').value.trim();

    const lines = [];
    if (lat) lines.push(`Latitude: ${lat}`);
    if (lon) lines.push(`Longitude: ${lon}`);
    if (ele) lines.push(`Elevation: ${ele}`);
    if (acc) lines.push(`Accuracy: ${acc}`);
    if (dt)  lines.push(`Time: ${dt}`);
    if (!lines.length) return;

    const base = { small: 18, medium: 26, large: 36 }[fsizeKey];
    const scale = img.width / 1000;
    const fs = Math.round(base * Math.max(scale, 0.6));
    const pad = Math.round(fs * 0.7);
    const lineH = Math.round(fs * 1.55);

    ctx.font = `${fs}px monospace`;
    const maxW = lines.reduce((m, l) => Math.max(m, ctx.measureText(l).width), 0);
    const boxW = maxW + pad * 2;
    const boxH = lines.length * lineH + pad;

    let bx, by;
    const margin = pad;
    if (corner === 'bl') { bx = 0; by = img.height - boxH; }
    else if (corner === 'br') { bx = img.width - boxW; by = img.height - boxH; }
    else if (corner === 'tl') { bx = 0; by = 0; }
    else { bx = img.width - boxW; by = 0; }

    // Beige background at 10% opacity
ctx.fillStyle = 'rgba(255, 255, 255, 0.68)';
ctx.fillRect(bx, by, boxW, boxH);

    // Black text
    ctx.fillStyle = '#000000';
    ctx.font = `${fs}px monospace`;
    lines.forEach((line, i) => {
      ctx.fillText(line, bx + pad, by + pad * 0.75 + fs + i * lineH);
    });
  };
  img.src = imgDataURL;
}

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    imgDataURL = e.target.result;

    // Reset all fields to fallback first
    setField('f-lat', DEFAULTS.lat, false);
    setField('f-lon', DEFAULTS.lon, false);
    setField('f-ele', DEFAULTS.ele, false);
    setField('f-acc', DEFAULTS.acc, false);
    setField('f-dt',  DEFAULTS.dt,  false);

    const tmpImg = new Image();
    tmpImg.onload = () => {
      EXIF.getData(tmpImg, function() {
        const tags = EXIF.getAllTags(this);

        const lat = dms(tags.GPSLatitude, tags.GPSLatitudeRef);
        const lon = dms(tags.GPSLongitude, tags.GPSLongitudeRef);
        if (lat != null) setField('f-lat', lat.toFixed(6), true);
        if (lon != null) setField('f-lon', lon.toFixed(6), true);

        const eleRaw = tags.GPSAltitude;
        if (eleRaw != null) {
          const eleVal = typeof eleRaw === 'object' ? eleRaw.numerator / eleRaw.denominator : eleRaw;
          setField('f-ele', eleVal.toFixed(2) + '±77.27 m', true);
        }

        const hpe = tags.GPSHPositioningError || tags.GPSDop;
        if (hpe != null) {
          const hpeVal = typeof hpe === 'object' ? hpe.numerator / hpe.denominator : hpe;
          setField('f-acc', hpeVal.toFixed(2) + ' m', true);
        }

        const dt = parseDate(tags.DateTimeOriginal || tags.DateTime);
        if (dt) setField('f-dt', dt, true);

        document.getElementById('panel').style.display = 'block';
        redraw();
      });
    };
    tmpImg.src = imgDataURL;
  };
  reader.readAsDataURL(file);
}

document.getElementById('file-input').addEventListener('change', e => handleFile(e.target.files[0]));

const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); });

// Redraw on any option or field change
document.querySelectorAll('input[name="corner"], input[name="fsize"]').forEach(el => el.addEventListener('change', redraw));
['f-lat','f-lon','f-ele','f-acc','f-dt'].forEach(id => {
  document.getElementById(id).addEventListener('input', redraw);
});

document.getElementById('download-btn').addEventListener('click', () => {
  const canvas = document.getElementById('preview-canvas');
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'stamped.jpg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/jpeg', 0.95);
});
</script>
</body>
</html>
